name: Release SKILL.md

# Gives every new SKILL.md a GitHub release, so
# https://github.com/big-halo/mira-sdk/releases/latest/download/SKILL.md
# always downloads the current file. The MIRA app repo pushes SKILL.md and
# skill.json here; nothing in this repo edits them.

on:
  push:
    branches: [main]
    paths: [SKILL.md, skill.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check skill.json matches SKILL.md
        id: info
        run: |
          set -euo pipefail
          sha="$(sha256sum SKILL.md | cut -d' ' -f1)"
          bytes="$(wc -c < SKILL.md | tr -d ' ')"
          updated="$(jq -r .updated skill.json)"
          [ "$(jq -r .sha256 skill.json)" = "$sha" ] || { echo "::error::skill.json sha256 does not match SKILL.md"; exit 1; }
          [ "$(jq -r .bytes skill.json)" = "$bytes" ] || { echo "::error::skill.json bytes do not match SKILL.md"; exit 1; }
          echo "$updated" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || { echo "::error::skill.json has no valid updated date"; exit 1; }
          day="$(TZ=America/Los_Angeles date -d "$updated" +%F)"
          {
            echo "sha=$sha"
            echo "tag=skill-$day-${sha:0:7}"
            echo "title=SKILL.md, $(TZ=America/Los_Angeles date -d "$updated" '+%B %-d, %Y')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.info.outputs.sha }}
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ steps.info.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          printf 'Download SKILL.md, attach it to your prompt in Claude, Codex or Claude Code, and describe your app.\n\nStep by step: https://trymira.com/docs/quickstart\n\nSHA-256: `%s`\n' "$SHA" > notes.md
          gh release create "$TAG" SKILL.md --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
